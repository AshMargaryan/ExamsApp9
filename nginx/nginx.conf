# Edge reverse proxy for the whole stack. This is the only container that
# publishes a port to the host/LAN — backend, frontend and db all stay on
# the internal Docker network (examsapp-network) and are reached here by
# Docker service name, never localhost.
#
# Routing:
#   /ws/*      -> backend:8000  (Django Channels — WebSocket upgrade)
#   /media/*   -> shared volume (Django doesn't serve MEDIA_URL when
#                 DEBUG=False, so this container reads the same
#                 backend_media volume the backend writes uploads to)
#   /static/, /api/, /admin/*  -> backend:8000 (Whitenoise serves /static/
#                 from inside the Daphne process even in prod)
#   everything else -> frontend:80 (the frontend's own nginx, which serves
#                 the built SPA and already handles client-side routing —
#                 see frontend/docker/nginx.conf)

upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Uploads (e.g. AI assistant attachments, avatars) pass through here —
    # keep this above Django's own request body limits so nginx isn't the
    # thing that rejects a legitimate upload first.
    client_max_body_size 20m;

    # Plain, unauthenticated liveness check for this container's own
    # HEALTHCHECK — answered locally, without involving backend/frontend,
    # so nginx reports healthy independently of their state.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Headers every proxied location needs: who the client actually is
    # (Django's ALLOWED_HOSTS / CORS / "Host:" dependent logic) and what
    # scheme they used, since that information would otherwise be lost
    # once the request becomes a plain HTTP hop to a container on the
    # internal network.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Django Channels WebSocket connections (games / chat / notifications —
    # see backend/config/asgi.py). These are long-lived, so they get their
    # own generous timeouts instead of the short HTTP ones above: a 60s
    # read timeout would silently kill an idle-but-open game socket.
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # User-uploaded files. Not proxied to Django: urls.py only wires up
    # MEDIA_URL when DEBUG=True (see backend/config/urls.py), so in
    # production nothing on the backend would answer these requests at
    # all. Instead this container mounts the same backend_media volume
    # the backend writes into and serves it directly.
    location /media/ {
        alias /var/www/media/;
    }

    location /static/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    # Everything else: the React SPA, served by the frontend container's
    # own nginx (which owns try_files/index.html fallback routing — see
    # frontend/docker/nginx.conf). Not duplicated here on purpose.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
    }
}
