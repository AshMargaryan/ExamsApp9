# Standard WebSocket upgrade recipe: when the client sends an "Upgrade"
# header (Channels' WS handshake), forward it and set Connection: upgrade;
# otherwise send a normal "close" Connection header for plain HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend:8000;
}

# The frontend container (prod target) runs its own nginx serving the built
# SPA on port 80 — this proxy just fronts it, it doesn't replace it.
upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Above the default 1m so chat/AI-assistant/flashcard attachment
    # uploads (up to CHAT_MAX_ATTACHMENT_SIZE_MB=20 today) aren't rejected
    # at the proxy before Django even sees them.
    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Django Channels WebSocket endpoints — apps.chat/games/notifications
    # routing.py all mount their consumers under /ws/ (see config/asgi.py).
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Default 60s read/send timeouts would silently kill idle game
        # rooms / chat / notification sockets between messages.
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
    }

    # Whitenoise-served static assets (config/settings.py STATIC_URL).
    location /static/ {
        proxy_pass http://backend_upstream;
    }

    # User uploads (avatars, chat/AI-assistant/flashcard attachments).
    # Served directly from the volume shared with the backend container
    # instead of proxying through Django: in production (DEBUG=False)
    # config/urls.py does NOT serve MEDIA_URL at all, so Django can't
    # answer these requests either way — this is required, not an
    # optimization.
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # Everything else: the React SPA, served by the frontend container's
    # own nginx (static build + client-side routing fallback).
    location / {
        proxy_pass http://frontend_upstream;
    }
}