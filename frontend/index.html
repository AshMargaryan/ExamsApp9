<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the Capacitor iOS build paint under the notch and
         home indicator; the --safe-* tokens in theme.css inset content back out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />

    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gitus" />
    <meta property="og:locale" content="hy_AM" />
    <meta property="og:title" content="Gitus — AI ուսումնական հարթակ դպրոցականների համար" />

      property="og:description"
      content="Հասկացիր բարդ թեմաները, պատրաստվիր քննություններին և հետևիր քո առաջընթացին Gitus-ի հետ։"
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gitus — AI ուսումնական հարթակ դպրոցականների համար" />
    <meta
      name="twitter:description"

    <link
