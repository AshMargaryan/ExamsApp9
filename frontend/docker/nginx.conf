server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses. JS/CSS bundles are the bulk of what
    # this server sends, and gzip on them is a large, free win.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints build assets (e.g. index-a1b2c3.js), so they're safe
    # to cache aggressively forever — a new build always produces a new
    # filename, never a stale one served from cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router does client-side routing: a request for e.g. /practice
    # is not a real file on disk, it's a route the React app resolves
    # itself. try_files falls through to index.html for anything that
    # isn't a real static asset, letting the SPA's router take over instead
    # of nginx returning a 404 on browser refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must NEVER be cached — it's the one file that
    # references the current (fingerprinted) JS/CSS bundle. A stale cached
    # index.html would keep pointing users at a deleted old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}