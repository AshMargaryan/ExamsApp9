# Production-style stack for the Raspberry Pi (or any single-host LAN)
# deployment. Unlike docker-compose.yml (dev: bind mounts, Vite dev server,
# services published straight to the host), this file builds the `prod`
# Dockerfile targets and puts nginx in front as the single public entry
# point. See Readme.md "Docker" for the commands.
#
# Explicit project name: without this, Compose defaults the project name to
# the directory name ("examsapp9"), which is exactly what docker-compose.yml
# (the dev file) also resolves to. That collision is real, not theoretical —
# both files would then share container names (examsapp9-db-1, ...) AND the
# "postgres_data" volume, so running this file could recreate/replace your
# dev containers and point a prod backend at your dev database. Pinning a
# distinct name, plus the explicit volume `name:` fields below, keeps every
# resource (containers, network, volumes) in its own namespace no matter
# which directory this is run from.
name: examsapp9-prod

services:
  db:
    image: postgres:16-alpine
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published — only reachable from other containers on
    # examsapp-network at db:5432. Unlike the dev compose file, there's no
    # host-side psql use case here (use `docker compose exec db psql ...`
    # if you need a shell on the Pi).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - examsapp-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - examsapp-network

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - backend/.env
    environment:
      # See docker-compose.yml's backend service for why this override
      # exists: backend/.env's DB_HOST=localhost is a dev-machine value,
      # but inside the Docker network Postgres is reachable at the `db`
      # service name, not localhost.
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      # Production must run with DEBUG=false regardless of what's left in
      # backend/.env (that file is also used for local/dev runs) — this is
      # what switches Whitenoise to serving the collected, hashed,
      # compressed bundle from STATIC_ROOT instead of the raw source tree,
      # and disables Django's own (dev-only) MEDIA_URL route.
      DEBUG: "false"
      # collectstatic must run once at container start so Whitenoise has a
      # hashed/gzipped bundle to serve in prod (DEBUG=False disables the
      # dev-only "serve straight from STATICFILES_DIRS" mode). Idempotent —
      # safe to run again on every restart/redeploy.
      DJANGO_COLLECTSTATIC: "true"
    volumes:
      # Shared with nginx (read-only there) so uploaded avatars/attachments
      # can be served directly instead of proxied through Django — see
      # nginx/nginx.conf's /media/ location and the comment there on why
      # that's required, not optional, once DEBUG=False.
      - backend_media:/app/media
    # No host port published — nginx is the only public entry point;
    # backend is reachable from other containers at backend:8000.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - examsapp-network

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Relative, not an absolute host:port URL: this is baked into the
        # JS bundle at build time and shipped to whatever device's browser
        # loads the site, so it must resolve against *that device's* view
        # of the LAN (nginx's origin), not a fixed dev-machine hostname/IP.
        # useChatSocket/useGameSocket/useNotificationSocket derive their
        # ws(s):// URL from this same value, so relative also makes the
        # WebSocket URLs LAN-IP-agnostic for free.
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
    # No host port published — served through nginx at frontend:80.
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - examsapp-network

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/var/www/media:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not "localhost" — same busybox-wget-doesn't-fall-back-to-
      # IPv4-on-::1 issue fixed in frontend/Dockerfile's HEALTHCHECK.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - examsapp-network

volumes:
  # Explicit names, distinct from docker-compose.yml's
  # examsapp9_dev_postgres_data/examsapp9_dev_frontend_node_modules —
  # production and development must never be able to read or overwrite
  # each other's database or files, even by accident.
  postgres_data:
    name: examsapp9_prod_postgres_data
  backend_media:
    name: examsapp9_prod_backend_media
  redis_data:
    name: examsapp9_prod_redis_data

networks:
  examsapp-network:
    driver: bridge
