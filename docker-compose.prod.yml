# Explicit project name — without this, Compose derives the project name
# from the directory ("examsapp9"), which is exactly what docker-compose.yml
# (dev) also resolves to. Two Compose files sharing a project name share
# containers, networks AND volumes: `postgres_data` in each file would
# resolve to the literal same volume, so a fresh prod deploy could recreate
# containers pointed at (and a `down -v` could destroy) the dev database.
# This name plus the explicit volume `name:` fields below make that
# impossible by construction rather than by convention.
name: examsapp9-prod

services:
  db:
    image: postgres:16-alpine
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" here on purpose (unlike docker-compose.yml's dev db,
    # which publishes 5433:5432 so you can psql in from the host). In
    # production nothing outside the Docker network needs to reach
    # Postgres directly — backend still reaches it at db:5432 internally.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - examsapp-network

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - backend/.env
    environment:
      # Same override docker-compose.yml uses in dev: inside the Docker
      # network, Postgres is reachable at the service name "db", not
      # "localhost" (which .env sets for running the backend bare-metal).
      DB_HOST: db
      # Production must run with DEBUG=false regardless of what's left in
      # backend/.env (that file is also used for local/dev runs) — this is
      # what switches Whitenoise to serving the collected, hashed,
      # compressed bundle from STATIC_ROOT instead of the raw source tree,
      # and disables Django's own (dev-only) MEDIA_URL route.
      DEBUG: "false"
      # The prod image has no bind-mounted source to run collectstatic
      # against ahead of time, so entrypoint.sh does it on every startup.
      # Idempotent — safe to run again on every restart/redeploy.
      DJANGO_COLLECTSTATIC: "true"
    volumes:
      # Persists user uploads (avatars, chat/AI-assistant attachments,
      # flashcard images, TTS cache — see backend/apps/*/models.py) across
      # container recreation, and is the same volume the nginx service
      # mounts read-only to serve /media/ directly (Django doesn't wire up
      # MEDIA_URL when DEBUG=False — see backend/config/urls.py).
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - examsapp-network
    # No "ports:" — nginx is the public entry point. backend:8000 stays
    # reachable only from other containers on examsapp-network.

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Relative, not an absolute host:port URL like dev's
        # http://localhost:8000/api. The browser talks to whatever
        # host/IP it used to load the page in the first place, and nginx
        # proxies /api + /ws back to the backend from there — so this
        # never has to know the Pi's LAN IP (which changes across
        # networks) at build time. See requirement about not hardcoding
        # the Pi's IP anywhere in this configuration.
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
    restart: unless-stopped
    networks:
      - examsapp-network
    # No "ports:" — reached only via nginx's frontend_upstream (frontend:80).

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/var/www/media:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not "localhost" — same busybox-wget-doesn't-fall-back-to-
      # IPv4-on-::1 issue fixed in frontend/Dockerfile's HEALTHCHECK.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - examsapp-network

volumes:
  # Explicit name, distinct from docker-compose.yml's
  # examsapp9_dev_postgres_data — production and development must never be
  # able to read or overwrite each other's database, even by accident.
  postgres_data:
    name: examsapp9_prod_postgres_data
  backend_media:
    name: examsapp9_prod_backend_media

networks:
  examsapp-network:
    driver: bridge
